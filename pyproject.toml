[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-kit"
dynamic = ["version"]
description = "Portable AI toolkit for Selenium Web UI test automation: locator healing, failure diagnosis, case generation and offline evaluation"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "selenium>=4.10",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "allure-pytest>=2.13",
]

[tool.setuptools.dynamic]
version = {attr = "ai_kit.__version__"}

[tool.setuptools.packages.find]
include = ["ai_kit*"]

[tool.setuptools.package-data]
"ai_kit.evaluation" = ["golden/*.json", "golden/fixtures/*.html"]
"ai_kit.profiles" = ["builtin/*.json", "sites/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

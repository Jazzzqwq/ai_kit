<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><title>el-table fixture</title></head>
<body>
  <!-- 坏定位器 ".el-table__rows" (含 el-table 触发语义, 但元素不存在) -->
  <div class="el-table">
    <div class="el-table__header-wrapper">
      <table class="el-table__header"><thead><tr><th>名称</th><th>状态</th></tr></thead></table>
    </div>
    <div class="el-table__body-wrapper">
      <table class="el-table__body" data-eval-target="tbody">
        <tbody>
          <tr class="el-table__row"><td>记录A</td><td>正常</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
